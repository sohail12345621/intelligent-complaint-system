<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Complaint Desk</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="topbar">
    <span class="mark">Complaint Desk</span>
    <a href="/">Home</a>
  </div>

  <div class="page">
    <div class="intro">
      <h1>All complaints</h1>
      <p>Review incoming complaints and move each one through its status as it gets handled.</p>
    </div>

    <div class="stats" id="stats"></div>

    <table id="complaintsTable">
      <thead>
        <tr><th>ID</th><th>Complaint</th><th>Category</th><th>Priority</th><th>Status</th><th>Date</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="/static/script.js"></script>
  <script>loadComplaints();</script>
</body>
</html>
